<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 0;
            min-height: 600px;
        }

        .sidebar {
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
            padding: 20px;
            overflow-y: auto;
            max-height: 800px;
        }

        .server-info {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .server-info h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .server-info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .server-info-item:last-child {
            border-bottom: none;
        }

        .server-info-label {
            font-weight: 600;
            color: #495057;
        }

        .server-info-value {
            color: #6c757d;
        }

        .status-connected {
            color: #28a745;
            font-weight: bold;
        }

        .status-disconnected {
            color: #dc3545;
            font-weight: bold;
        }

        .tools-list {
            list-style: none;
        }

        .tool-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .tool-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea10 0%, #764ba210 100%);
        }

        .tool-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .tool-description {
            color: #6c757d;
            font-size: 0.9em;
        }

        .main-content {
            padding: 30px;
            overflow-y: auto;
            max-height: 800px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .tool-detail {
            background: white;
        }

        .tool-detail-header {
            margin-bottom: 25px;
        }

        .tool-detail-header h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .tool-detail-header p {
            color: #6c757d;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .json-editor {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .json-editor:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .result-box {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-box.error {
            background: #fff3f3;
            border-color: #dc3545;
        }

        .result-box.success {
            background: #f0fff4;
            border-color: #28a745;
        }

        .result-content {
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fff3f3;
            border: 2px solid #dc3545;
            color: #dc3545;
        }

        .alert-success {
            background: #f0fff4;
            border: 2px solid #28a745;
            color: #28a745;
        }

        .schema-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .schema-param {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .schema-param-name {
            font-weight: 600;
            color: #333;
        }

        .schema-param-type {
            color: #6c757d;
            font-size: 0.9em;
        }

        .schema-param-required {
            color: #dc3545;
            font-size: 0.8em;
            margin-left: 5px;
        }

        @media (max-width: 968px) {
            .content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: none;
                border-bottom: 1px solid #e9ecef;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 MCP Test Client</h1>
            <p>Model Context Protocol - Interactive Tool Tester</p>
        </div>

        <div class="content">
            <div class="sidebar">
                <div class="server-info">
                    <h3>Server Information</h3>
                    <div id="serverInfoContent">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Loading server info...</p>
                        </div>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button id="connectBtn" class="btn btn-primary" style="flex: 1;" onclick="connectToServer()">
                            🔌 Connect
                        </button>
                        <button id="disconnectBtn" class="btn btn-secondary" style="flex: 1; display: none;" onclick="disconnectFromServer()">
                            ⛔ Disconnect
                        </button>
                    </div>
                </div>

                <h3 style="margin-bottom: 15px; color: #667eea;">Available Tools</h3>
                <div id="toolsList">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading tools...</p>
                    </div>
                </div>
            </div>

            <div class="main-content" id="mainContent">
                <div class="empty-state">
                    <div class="empty-state-icon">🔨</div>
                    <h3>Select a Tool</h3>
                    <p>Choose a tool from the list on the left to view its details and test it.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTool = null;
        let tools = [];
        let connectionCheckInterval = null;

        // Load server info
        async function loadServerInfo() {
            try {
                const response = await fetch('/api/mcp/server');
                if (!response.ok) {
                    throw new Error('Failed to load server info');
                }
                const data = await response.json();
                renderServerInfo(data);
            } catch (error) {
                console.error('Error loading server info:', error);
                document.getElementById('serverInfoContent').innerHTML = `
                    <div class="alert alert-error">
                        Failed to load server info
                    </div>
                `;
            }
        }

        // Render server info
        function renderServerInfo(info) {
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            let statusHtml = '';
            
            if (info.connected) {
                statusHtml = `
                    <div class="server-info-item">
                        <span class="server-info-label">Name:</span>
                        <span class="server-info-value">${info.name}</span>
                    </div>
                    <div class="server-info-item">
                        <span class="server-info-label">Version:</span>
                        <span class="server-info-value">${info.version}</span>
                    </div>
                    <div class="server-info-item">
                        <span class="server-info-label">URL:</span>
                        <span class="server-info-value">${info.url}</span>
                    </div>
                    <div class="server-info-item">
                        <span class="server-info-label">Status:</span>
                        <span class="status-connected">● Connected</span>
                    </div>
                `;
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'block';
            } else if (info.connecting) {
                statusHtml = `
                    <div class="server-info-item">
                        <span class="server-info-label">URL:</span>
                        <span class="server-info-value">${info.url}</span>
                    </div>
                    <div class="server-info-item">
                        <span class="server-info-label">Status:</span>
                        <span style="color: #ffc107; font-weight: bold;">⏳ Connecting...</span>
                    </div>
                `;
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'none';
            } else {
                statusHtml = `
                    <div class="server-info-item">
                        <span class="server-info-label">URL:</span>
                        <span class="server-info-value">${info.url}</span>
                    </div>
                    <div class="server-info-item">
                        <span class="server-info-label">Status:</span>
                        <span class="status-disconnected">● Disconnected</span>
                    </div>
                    ${info.error ? `
                        <div style="margin-top: 10px; padding: 10px; background: #fff3f3; border-radius: 6px; font-size: 0.85em; color: #dc3545;">
                            <strong>Error:</strong> ${info.error}
                        </div>
                    ` : ''}
                `;
                connectBtn.style.display = 'block';
                disconnectBtn.style.display = 'none';
            }
            
            document.getElementById('serverInfoContent').innerHTML = statusHtml;
        }

        // Connect to server
        async function connectToServer() {
            try {
                const response = await fetch('/api/mcp/connect', { method: 'POST' });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Connection failed');
                }
                
                // Start polling for connection status
                startConnectionCheck();
                loadServerInfo();
            } catch (error) {
                console.error('Error connecting:', error);
                alert('Failed to connect: ' + error.message);
            }
        }

        // Disconnect from server
        async function disconnectFromServer() {
            try {
                const response = await fetch('/api/mcp/disconnect', { method: 'POST' });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Disconnect failed');
                }
                
                stopConnectionCheck();
                loadServerInfo();
                loadTools(); // Clear tools list
                document.getElementById('mainContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔨</div>
                        <h3>Select a Tool</h3>
                        <p>Connect to an MCP server and choose a tool from the list on the left.</p>
                    </div>
                `;
            } catch (error) {
                console.error('Error disconnecting:', error);
                alert('Failed to disconnect: ' + error.message);
            }
        }

        // Start polling connection status
        function startConnectionCheck() {
            stopConnectionCheck();
            connectionCheckInterval = setInterval(() => {
                loadServerInfo();
                // If connected, load tools
                loadTools();
            }, 1000);
        }

        // Stop polling connection status
        function stopConnectionCheck() {
            if (connectionCheckInterval) {
                clearInterval(connectionCheckInterval);
                connectionCheckInterval = null;
            }
        }

        // Load tools
        async function loadTools() {
            try {
                const response = await fetch('/api/mcp/tools');
                if (!response.ok) {
                    // Server not connected, don't show error
                    tools = [];
                    renderToolsList();
                    return;
                }
                tools = await response.json();
                renderToolsList();
            } catch (error) {
                console.error('Error loading tools:', error);
                tools = [];
                renderToolsList();
            }
        }

        // Render tools list
        function renderToolsList() {
            if (tools.length === 0) {
                document.getElementById('toolsList').innerHTML = `
                    <p style="color: #6c757d; text-align: center; padding: 20px;">
                        No tools available
                    </p>
                `;
                return;
            }

            const html = tools.map(tool => `
                <div class="tool-item ${currentTool && currentTool.name === tool.name ? 'active' : ''}" 
                     onclick="selectTool('${tool.name}')">
                    <div class="tool-name">${tool.name}</div>
                    <div class="tool-description">${tool.description || 'No description'}</div>
                </div>
            `).join('');

            document.getElementById('toolsList').innerHTML = html;
        }

        // Select tool
        async function selectTool(toolName) {
            try {
                const response = await fetch(`/api/mcp/tools/${toolName}`);
                if (!response.ok) {
                    throw new Error('Failed to load tool details');
                }
                currentTool = await response.json();
                renderToolDetail();
                renderToolsList(); // Update active state
            } catch (error) {
                console.error('Error loading tool:', error);
                alert('Failed to load tool details');
            }
        }

        // Render tool detail
        function renderToolDetail() {
            if (!currentTool) return;

            const schema = currentTool.inputSchema || {};
            const properties = schema.properties || {};
            const required = schema.required || [];

            // Create default arguments from schema
            const defaultArgs = {};
            Object.keys(properties).forEach(key => {
                const prop = properties[key];
                const isRequired = required.includes(key);
                if (prop.type === 'string') {
                    defaultArgs[key] = '';
                } else if (prop.type === 'number' || prop.type === 'integer') {
                    defaultArgs[key] = 0;
                } else if (prop.type === 'boolean') {
                    defaultArgs[key] = false;
                } else if (prop.type === 'object') {
                    defaultArgs[key] = {};
                } else if (prop.type === 'array') {
                    defaultArgs[key] = [];
                } else {
                    defaultArgs[key] = null;
                }
            });

            const html = `
                <div class="tool-detail">
                    <div class="tool-detail-header">
                        <h2>${currentTool.name}</h2>
                        <p>${currentTool.description || 'No description available'}</p>
                    </div>

                    <div class="section">
                        <h3>📋 Parameters</h3>
                        ${Object.keys(properties).length > 0 ? `
                            <div class="schema-info">
                                ${Object.keys(properties).map(key => {
                                    const prop = properties[key];
                                    const isRequired = required.includes(key);
                                    return `
                                        <div class="schema-param">
                                            <div class="schema-param-name">
                                                ${key}
                                                ${isRequired ? '<span class="schema-param-required">* Required</span>' : ''}
                                            </div>
                                            <div class="schema-param-type">
                                                Type: ${prop.type || 'any'} 
                                                ${prop.enum ? ` | Values: ${prop.enum.join(', ')}` : ''}
                                                ${prop.description ? ` | ${prop.description}` : ''}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        ` : '<p style="color: #6c757d;">No parameters required</p>'}
                    </div>

                    <div class="section">
                        <h3>✏️ Request Arguments (JSON)</h3>
                        <textarea 
                            id="jsonEditor" 
                            class="json-editor"
                        >${JSON.stringify(defaultArgs, null, 2)}</textarea>
                        <p style="color: #6c757d; margin-top: 10px; font-size: 0.9em;">
                            💡 Edit the JSON above to customize your request. Click "Call Tool" to execute.
                        </p>
                    </div>

                    <div class="section">
                        <button class="btn btn-primary" onclick="callTool()">
                            🚀 Call Tool
                        </button>
                        <button class="btn btn-secondary" onclick="resetJson()">
                            🔄 Reset JSON
                        </button>
                    </div>

                    <div id="resultContainer" style="display: none;">
                        <div class="section">
                            <h3>📤 Result</h3>
                            <div id="resultBox" class="result-box">
                                <pre id="resultContent" class="result-content"></pre>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('mainContent').innerHTML = html;
        }

        // Reset JSON to default
        function resetJson() {
            if (currentTool) {
                renderToolDetail();
            }
        }

        // Call tool
        async function callTool() {
            if (!currentTool) return;

            const jsonEditor = document.getElementById('jsonEditor');
            let args;
            
            try {
                args = JSON.parse(jsonEditor.value);
            } catch (error) {
                alert('Invalid JSON: ' + error.message);
                return;
            }

            const resultContainer = document.getElementById('resultContainer');
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            resultContainer.style.display = 'block';
            resultBox.className = 'result-box';
            resultContent.textContent = 'Calling tool...';

            try {
                const response = await fetch(`/api/mcp/tools/${currentTool.name}/call`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ arguments: args })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Tool call failed');
                }

                const result = await response.json();
                
                if (result.error) {
                    resultBox.className = 'result-box error';
                } else {
                    resultBox.className = 'result-box success';
                }

                // Format result
                const formattedResult = result.content.map(c => c.text).join('\n\n');
                resultContent.textContent = formattedResult;

            } catch (error) {
                resultBox.className = 'result-box error';
                resultContent.textContent = 'Error: ' + error.message;
            }
        }

        // Load data on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadServerInfo();
            loadTools();
        });
    </script>
</body>
</html>
