# Quarkus configuration
# Note: 8082 is occupied by the docker container redpanda-console in this environment.
quarkus.http.port=${QUARKUS_HTTP_PORT:8085}

# Load environment variables from the .env file in the working directory.
# Missing files are ignored; the ${VAR:default} placeholders below provide fallbacks.
quarkus.config.locations=.env

# MCP Server configuration
# MCP servers are defined exclusively in config/mcp-servers.json
# (fallback: classpath:/mcp-servers.json) and loaded at startup.
mcp.config.path=./config

# AI Chat agent (optional)
# Enables the LangChain4j AI chat that can use the connected MCP server as tools.
# Set AI_CHAT_ENABLED=true in .env (or override the default) to activate.
ai.chat.enabled=${AI_CHAT_ENABLED:false}
# Max messages kept in the chat history window per session.
ai.chat.memory.max-messages=20

# OpenAI-compatible model endpoint used by the AI chat agent.
# Values are read from the .env file (quarkus.config.locations=.env):
#   OPENAI_API_KEY   -> quarkus.langchain4j.openai.api-key
#   OPENAI_BASE_URL  -> quarkus.langchain4j.openai.base-url
#   OPENAI_MODEL     -> quarkus.langchain4j.openai.chat-model.model-name
# Fallbacks below keep the app startable without a .env file (local Ollama, dummy key).
# Note: quarkus-langchain4j-openai refuses the dummy key only together with the
# default OpenAI base URL, so the fallback base-url differs from the OpenAI default.
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:http://localhost:11434/v1/}
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:dummy}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:qwen3.5-32k:latest}
